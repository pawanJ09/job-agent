services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: jobs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_agent -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: __IMAGE__
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://job_agent:${POSTGRES_PASSWORD}@db:5432/jobs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

volumes:
  pgdata:
