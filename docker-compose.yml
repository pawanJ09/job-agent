version: "3.9"

services:
  db:
    image: postgres:16
    container_name: job-agent-db
    restart: always
    environment:
      POSTGRES_USER: job_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jobs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_agent -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    container_name: job-agent-app
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://job_agent:${POSTGRES_PASSWORD}@db:5432/jobs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./app/data:/app/data   # resume file, saved login session, etc. live here

volumes:
  pgdata:
